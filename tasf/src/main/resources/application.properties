spring.application.name=TasfTravelControl

# ── CORS ─────────────────────────────────────────────────────────────────────
# Orígenes permitidos (lista separada por comas; admite patrones). Se lee la
# variable de entorno CORS_ORIGINS; sin ella, "*" (ver CorsConfig).
#   export CORS_ORIGINS=https://tasf.midominio.com

# ── Detrás de nginx (reverse proxy) ─────────────────────────────────────────
# Despliegue actual: nginx sirve el frontend por HTTPS y proxea /api a
# http://127.0.0.1:8080 (mismo origen ⇒ el navegador no exige CORS, PERO los
# POST llevan cabecera Origin igualmente: por eso el @CrossOrigin cableado a
# localhost daba 403 "Invalid CORS request" en INICIAR). Si algún día Spring
# necesita conocer el esquema/host reales (redirects, URLs absolutas):
#server.forward-headers-strategy=framework

# ── HTTPS (certificado propio) ───────────────────────────────────────────────
# IMPORTANTE: si el frontend se sirve por HTTPS, el backend TAMBIÉN debe ir por
# HTTPS — el navegador bloquea llamadas http:// desde una página https://
# (mixed content), aunque el CORS esté bien.
#
# Opción A (recomendada si hay nginx/caddy): terminar TLS en el reverse proxy
#   y dejar el backend en http interno. Con el frontend y /api en el MISMO
#   dominio, además, desaparece el CORS por completo.
#
# Opción B: TLS directo en Spring Boot. Convertir el cert a PKCS12 si hace falta:
#   openssl pkcs12 -export -in fullchain.pem -inkey privkey.pem \
#     -out tasf.p12 -name tasf -passout pass:CAMBIAME
# y descomentar (o pasar como variables de entorno SERVER_* / SSL_*):
#server.port=8443
#server.ssl.enabled=true
#server.ssl.key-store=file:/ruta/al/tasf.p12
#server.ssl.key-store-type=PKCS12
#server.ssl.key-store-password=CAMBIAME
#server.ssl.key-alias=tasf
